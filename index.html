<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego para Juneia</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1>TE AMO MUCHO REINA</h1>
        <p>Haga clic en los corazones antes de que desaparezcan shii</p>
        <p>Puntuación: <span id="score">0</span></p>
        <p>Tiempo: <span id="time">30</span> s</p>
        <button id="start-game">Iniciar Juego</button>
        <div id="game"></div>
        <p id="message"></p>
        <a id="special-video" href="https://youtu.be/1n9d-f079Yk?si=dFGNXMvLW8e44Pg2" target="_blank" style="display: none;">🎥 Ver Video Especial 🎥</a>
    </div>
    
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const gameContainer = document.getElementById("game");
            const message = document.getElementById("message");
            const startButton = document.getElementById("start-game");
            const scoreDisplay = document.getElementById("score");
            const timeDisplay = document.getElementById("time");
            const videoButton = document.getElementById("special-video");
            const messages = [
                "Eres mi todo, Juneia ❤️",
                "Cada día a tu lado es un regalo 🎁",
                "Te amo más de lo que las palabras pueden decir 😘",
                "Mi corazón es tuyo para siempre 💕",
                "Eres la luz de mi vida ✨"
            ];
            let interval;
            let score = 0;
            let timeLeft = 30;
            let timer;
            
            function updateScore() {
                score += 10;
                scoreDisplay.textContent = score;
                if (score >= 100) {
                    endGame();
                }
            }
            
            function startTimer() {
                timeLeft = 30;
                timeDisplay.textContent = timeLeft;
                timer = setInterval(() => {
                    timeLeft--;
                    timeDisplay.textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        clearInterval(interval);
                        message.textContent = "¡Tiempo agotado bb! Inténtalo de nuevo.";
                    }
                }, 1000);
            }
            
            function createHeart() {
                const heart = document.createElement("div");
                heart.classList.add("heart");
                heart.style.left = Math.random() * 90 + "%";
                heart.style.top = Math.random() * 90 + "%";
                heart.addEventListener("click", () => {
                    message.textContent = messages[Math.floor(Math.random() * messages.length)];
                    updateScore();
                    heart.remove();
                });
                gameContainer.appendChild(heart);
                
                setTimeout(() => heart.remove(), 2000);
            }
            
            function startGame() {
                gameContainer.innerHTML = "";
                message.textContent = "";
                score = 0;
                scoreDisplay.textContent = score;
                videoButton.style.display = "none";
                clearInterval(interval);
                clearInterval(timer);
                startTimer();
                interval = setInterval(createHeart, 1000);
            }
            
            function endGame() {
                clearInterval(timer);
                clearInterval(interval);
                message.textContent = "¡Felicidades, AMOR! Ahora puede ver su sorpresa 🎁";
                videoButton.style.display = "block";
            }
            
            startButton.addEventListener("click", () => {
                startButton.style.display = "none";
                startGame();
            });
        });
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            background-color: #1a1a2e;
            color: #fff;
        }
        .game-container {
            margin-top: 50px;
        }
        #game {
            position: relative;
            width: 400px;
            height: 400px;
            margin: auto;
            border: 4px solid #ff007f;
            background: linear-gradient(135deg, #ff6699, #ff3366);
            overflow: hidden;
            box-shadow: 0px 0px 15px #ff007f;
        }
        .heart {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #ff0000;
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 50% 80%, 20% 100%, 0% 35%);
            cursor: pointer;
            transition: transform 0.3s;
        }
        .heart:hover {
            transform: scale(1.2);
        }
        button, a {
            margin: 10px;
            padding: 12px;
            font-size: 16px;
            background: linear-gradient(45deg, #ff007f, #ff3366);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, a:hover {
            background: linear-gradient(45deg, #ff3366, #ff007f);
            box-shadow: 0px 0px 10px #ff007f;
        }
    </style>
</body>
</html>
