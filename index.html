<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi novia?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffccdc;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h1 {
            color: #e60073;
        }
        button {
            font-size: 18px;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #yesBtn {
            background-color: #ff4081;
            color: white;
        }
        #noBtn {
            background-color: #ccc;
            color: black;
            position: absolute;
        }
        #message {
            display: none;
            margin-top: 20px;
        }
        #sendBtn {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>¿Quieres ser mi novia?</h1>
        <button id="yesBtn" onclick="showMessage()">Sí</button>
        <button id="noBtn" onmouseover="moveButton()">No</button>
        <div id="message">
            <p>Sabía que sentías atracción por mí. Te agradezco por elegirme. Quiero empezar a conocerte poco a poco. ¡Muchas gracias!</p>
            <input type="text" id="reason" placeholder="Escribe por qué dijiste sí">
            <button id="sendBtn" onclick="sendToWhatsApp()">Enviar Respuesta</button>
        </div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").style.display = "block";
        }

        function moveButton() {
            let x = Math.random() * (window.innerWidth - 100);
            let y = Math.random() * (window.innerHeight - 100);
            document.getElementById("noBtn").style.left = x + "px";
            document.getElementById("noBtn").style.top = y + "px";
        }

        function sendToWhatsApp() {
            let reason = document.getElementById("reason").value;
            let phoneNumber = "912725938";
            let message = encodeURIComponent("Te dije 'sí' porque, " + reason);
            window.location.href = "https://wa.me/" + phoneNumber + "?text=" + message;
        }
    </script>
</body>
</html>
